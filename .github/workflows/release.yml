name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Tag & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Git tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "Git tag version: ${TAG_VERSION}"
          echo "Cargo.toml version: ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "Error: Git tag (${GITHUB_REF_NAME}) does not match Cargo.toml version (${CARGO_VERSION})."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Verify crates.io package dry-run
        run: cargo publish --locked --dry-run

  publish-crates-io:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret is not set; skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked

  build-binaries:
    name: Build Release Binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl-tools for static Linux builds
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/dotler" staging/
          cp README.md LICENSE staging/
          tar -C staging -czf "dist/dotler-${{ matrix.target }}.tar.gz" dotler README.md LICENSE
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dotler-${{ matrix.target }}.tar.gz" > "dotler-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "dotler-${{ matrix.target }}.tar.gz" > "dotler-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Package Windows archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dotler.exe" -Destination staging/
          Copy-Item README.md, LICENSE -Destination staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/dotler-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/dotler-${{ matrix.target }}.zip").Hash.ToLower()
          "$hash  dotler-${{ matrix.target }}.zip" | Out-File -Encoding ascii -NoNewline "dist/dotler-${{ matrix.target }}.zip.sha256"
          Add-Content -Encoding ascii -Path "dist/dotler-${{ matrix.target }}.zip.sha256" -Value ""

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs:
      - build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate structured release notes from commit history
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -Fxv "${CURRENT_TAG}" | head -n 1 || true)"

          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          else
            RANGE="${CURRENT_TAG}"
          fi

          FEAT=""
          FIX=""
          REFACTOR=""
          OTHER=""

          while IFS=$'\t' read -r HASH SUBJECT; do
            [ -z "${HASH}" ] && continue
            case "${SUBJECT}" in
              Merge\ *|*\(infra\):*|docs*|test*|chore*|ci*)
                continue
                ;;
              feat\(*\):*)
                SCOPE="${SUBJECT#feat(}"; SCOPE="${SCOPE%%):*}"
                DESC="${SUBJECT#feat(${SCOPE}): }"
                FEAT="${FEAT}- **${SCOPE}**: ${DESC} (\`${HASH}\`)"$'\n'
                ;;
              feat:*)
                DESC="${SUBJECT#feat: }"
                FEAT="${FEAT}- ${DESC} (\`${HASH}\`)"$'\n'
                ;;
              fix\(*\):*)
                SCOPE="${SUBJECT#fix(}"; SCOPE="${SCOPE%%):*}"
                DESC="${SUBJECT#fix(${SCOPE}): }"
                FIX="${FIX}- **${SCOPE}**: ${DESC} (\`${HASH}\`)"$'\n'
                ;;
              fix:*)
                DESC="${SUBJECT#fix: }"
                FIX="${FIX}- ${DESC} (\`${HASH}\`)"$'\n'
                ;;
              refactor\(*\):*|perf\(*\):*)
                TYPE="${SUBJECT%%(*}"
                SCOPE="${SUBJECT#${TYPE}(}"; SCOPE="${SCOPE%%):*}"
                DESC="${SUBJECT#${TYPE}(${SCOPE}): }"
                REFACTOR="${REFACTOR}- **${SCOPE}**: ${DESC} (\`${HASH}\`)"$'\n'
                ;;
              refactor:*|perf:*)
                TYPE="${SUBJECT%%:*}"
                DESC="${SUBJECT#${TYPE}: }"
                REFACTOR="${REFACTOR}- ${DESC} (\`${HASH}\`)"$'\n'
                ;;
              *)
                OTHER="${OTHER}- ${SUBJECT} (\`${HASH}\`)"$'\n'
                ;;
            esac
          done < <(git log "${RANGE}" --no-merges --pretty=format:$'%h\t%s')

          {
            echo "## What's Changed in ${CURRENT_TAG}"
            echo ""
            if [ -n "${FEAT}" ]; then
              echo "### Features (\`feat\`)"
              printf "%s\n" "${FEAT}"
            fi
            if [ -n "${FIX}" ]; then
              echo "### Bug Fixes (\`fix\`)"
              printf "%s\n" "${FIX}"
            fi
            if [ -n "${REFACTOR}" ]; then
              echo "### Refactoring & Performance (\`refactor\` / \`perf\`)"
              printf "%s\n" "${REFACTOR}"
            fi
            if [ -n "${OTHER}" ]; then
              echo "### Other Changes"
              printf "%s\n" "${OTHER}"
            fi
            if [ -n "${PREV_TAG}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
              echo ""
            fi
            cat << 'EOF'
          ### Quick Install & Update

          **Update existing installation**:

          ```sh
          dotler update
          ```

          **Linux / macOS**:

          ```sh
          curl -fsSL https://msisdev.github.io/dotler/install.sh | sh
          ```

          **Windows (PowerShell)**:

          ```powershell
          irm https://msisdev.github.io/dotler/install.ps1 | iex
          ```

          ### Prebuilt Binary Download Guide

          | OS | Architecture | C Library / Linkage | Archive File |
          | :--- | :--- | :--- | :--- |
          | **Linux** | `x86_64` (64-bit Intel/AMD) | `musl` (Static, Portable) | `dotler-x86_64-unknown-linux-musl.tar.gz` |
          | **Linux** | `x86_64` (64-bit Intel/AMD) | `glibc 2.39+` (Dynamic) | `dotler-x86_64-unknown-linux-gnu.tar.gz` |
          | **Linux** | `aarch64` (`ARM64`) | `musl` (Static, Portable) | `dotler-aarch64-unknown-linux-musl.tar.gz` |
          | **Linux** | `aarch64` (`ARM64`) | `glibc 2.39+` (Dynamic) | `dotler-aarch64-unknown-linux-gnu.tar.gz` |
          | **macOS** | `aarch64` (Apple Silicon) | System | `dotler-aarch64-apple-darwin.tar.gz` |
          | **macOS** | `x86_64` (Intel Mac) | System | `dotler-x86_64-apple-darwin.tar.gz` |
          | **Windows** | `x86_64` (64-bit Intel/AMD) | MSVC | `dotler-x86_64-pc-windows-msvc.zip` |
          | **Windows** | `aarch64` (`ARM64`) | MSVC | `dotler-aarch64-pc-windows-msvc.zip` |

          > **Linux (`glibc` vs. `musl`)**:
          > - **`-linux-musl` (Recommended for broad compatibility)**: Statically linked with zero host `glibc` dependency. Use this on Alpine Linux, older distributions (`glibc < 2.39` such as Ubuntu 22.04 or Debian 12), or if you encounter a `GLIBC_2.39 not found` warning.
          > - **`-linux-gnu`**: Dynamically linked against `glibc 2.39+` (built on Ubuntu 24.04). Use this on modern `glibc` systems (Ubuntu 24.04+, Arch Linux, Fedora 40+).
          EOF
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/SHA256SUMS.txt
            book/src/install.sh
            book/src/install.ps1
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true

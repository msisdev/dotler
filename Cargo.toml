[package]
name = "dotler"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Minseob Kim"]
description = "Deterministic dotfile manager with selective encryption, Git sharing, and AI/MCP support."
license = "MIT"
repository = "https://github.com/msisdev/dotler"
homepage = "https://msisdev.github.io/dotler/"
documentation = "https://msisdev.github.io/dotler/"
readme = "README.md"
keywords = ["dotfiles", "cli", "encryption", "configuration", "mcp"]
categories = ["command-line-utilities", "config", "cryptography"]
exclude = [".github/", "book/"]

[[bin]]
name = "dotler"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
blake3 = "1.5"
thiserror = "2.0"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
bip39 = "2.1"
secrecy = { version = "0.8", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
base64 = "0.22"
rand = "0.8"
rpassword = "7.3"
glob = "0.3"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.17"

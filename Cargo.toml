[package]
name = "dotler"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Minseob Kim"]
description = "Deterministic dotfile manager with selective encryption, Git sharing, and AI/MCP support."
license = "MIT"
repository = "https://github.com/msisdev/dotler"
homepage = "https://msisdev.github.io/dotler/"
documentation = "https://msisdev.github.io/dotler/"
readme = "README.md"
keywords = ["dotfiles", "cli", "encryption", "configuration", "mcp"]
categories = ["command-line-utilities", "config", "cryptography"]
exclude = [".github/", "book/"]

[[bin]]
name = "dotler"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
blake3 = { version = "1.5", default-features = false, features = ["std"] }
argon2 = { version = "0.5", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
getrandom = "0.2"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
gix = { version = "0.87", default-features = false, features = ["blocking-network-client", "sha1", "max-performance-safe"] }
gix-transport = { version = "0.59", default-features = false, features = ["http-client"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = { version = "3.27", default-features = false }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

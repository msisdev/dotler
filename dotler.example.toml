# [bash]
# # Group paths must start with "~" / "~/..." (home directory)
# # or "." / "./..." (current working directory).
# # Priority 1: Custom device names (configured in ~/.config/dotler/config.toml `default_devices`)
# default = "~"
#
# # Priority 2: Specific OS / Linux distribution
# os-arch = "~"
# os-debian = "~"
# os-ubuntu = "~"
# os-fedora = "~"
# os-nixos = "~"
# os-alpine = "~"
# os-freebsd = "~"
# os-openbsd = "~"
#
# # Priority 3: OS family fallback
# os-nux = "~"
# os-mac = "~"
# os-win = "~"
# os-bsd = "~"
#
# # Unmatched files are ignored by default.
# # Syntax per line (Last-Match-Wins):
# #   <pattern>               -> include as plaintext
# #   <pattern> enc           -> include content-encrypted (.dotler.enc; alias: enc=cont)
# #   <pattern> enc=full      -> include path+content full-encrypted (.dotler.fenc)
# #   <pattern> tpl           -> include as template ({{ $HOME }} <-> home dir)
# #   <pattern> enc tpl       -> include content-encrypted + template (.dotler.enc)
# #   <pattern> enc=full tpl  -> include full-encrypted + template (.dotler.fenc)
# #   !<pattern>              -> exclude (override a broader include rule)
# files = """
# .bashrc
# .bash_profile tpl
# .netrc enc
# """
#
# # Optional dotted sub-groups: store archives in nested `<group>/<sub...>/` folders.
# # Define `os-*` / device paths ONLY on the top-level group (`<root_path>/<sub...>` is derived automatically).
# # [vault]
# # os-nux = "./notes"
# # os-mac = "./notes"
# # os-win = "./notes"
# # files = "* enc=full"
# #
# # [vault.sleep]
# # files = "* enc=full"
